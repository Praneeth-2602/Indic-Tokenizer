name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Rust format
        run: cargo fmt --manifest-path rust/inditok-core/Cargo.toml --check
      - name: Rust tests
        run: cargo test --manifest-path rust/inditok-core/Cargo.toml
      - name: Build extension
        run: maturin develop
      - name: Python tests
        run: pytest
      - name: Throughput regression check
        run: python benchmarks/bench_tokenizers.py --assert-min-chars-per-second 500000
